name: Public source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-core-and-build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Verify toolchain versions
        run: |
          if ((node --version) -ne 'v24.20.0') { exit 1 }
          if ((npm --version) -ne '11.19.0') { exit 1 }
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit the public source inventory and permission records
        run: npm run release:audit
      - name: Check all TypeScript profiles
        run: npm run typecheck
      - name: Run the bounded offline synthetic core suite
        run: npm run test:public
      - name: Test the public release tooling
        run: npm run test:release
      - name: Test portable installation boundaries without installing SDKs
        run: npm run test:setup
      - name: Test binary installer paths and packaged startup contracts
        run: |
          npm run test:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dependency license inventory
        run: npm run licenses:check
      - name: Check desktop source security boundaries
        run: npm run test:security
      - name: Bundle source profiles into isolated outputs
        run: npm run check:public-source

  portable-windows-desktop:
    needs: offline-core-and-build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      AAW_DOWNLOAD_TIMEOUT_MS: '600000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: '3.13'
      - name: Prepare a fresh isolated data root
        run: |
          New-Item -ItemType Directory -Path .local/ci -Force | Out-Null
          $testDataRoot = Join-Path $env:RUNNER_TEMP 'aaw-portable-ci-${{ github.run_id }}'
          "AAW_PORTABLE_STORAGE=$testDataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the locked source dependencies
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
      - name: Install public SDKs and prove native isolation and cleanup
        env:
          AAW_NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          npm run setup:desktop -- "--storage-root=$env:AAW_PORTABLE_STORAGE" 2>&1 | Tee-Object .local/ci/setup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check runtime readiness without downloading
        run: |
          npm run doctor -- "--storage-root=$env:AAW_PORTABLE_STORAGE" 2>&1 | Tee-Object .local/ci/doctor.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the normal production desktop
        run: npm run build:cloud
      - name: Exercise empty first launch, synthetic schematic and cold recovery
        run: |
          node tools/portable-desktop-smoke.mjs "--storage-root=$env:AAW_PORTABLE_STORAGE" --phase=both
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep bounded synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-desktop-verification-${{ github.run_number }}
          retention-days: 7
          path: |
            .local/ci
            .local/desktop-smoke
            .local/runtime/verification
            .local/runtime/build/*/*-compiler.log
          if-no-files-found: ignore

  windows-installer:
    needs: offline-core-and-build
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      AAW_DOWNLOAD_TIMEOUT_MS: '600000'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        id: python
        with:
          python-version: '3.13'
      - name: Install locked build dependencies
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((node --version) -ne 'v24.20.0' -or (npm --version) -ne '11.19.0') { exit 1 }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download fixed public native SDK inputs
        run: node tools/setup-desktop.mjs download-native
      - name: Build a self-contained current-user installer
        env:
          AAW_NATIVE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipts = @(Get-ChildItem -LiteralPath .local/windows-installer -Directory -Filter 'build-*' | ForEach-Object { Join-Path $_.FullName 'build-result.json' } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($receipts.Count -ne 1) { throw 'Expected exactly one new build receipt' }
          "AAW_INSTALLER_RESULT=$($receipts[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $receipt = Get-Content -LiteralPath $receipts[0] -Raw | ConvertFrom-Json
          if ($receipt.sourceRevision.dirty -or $receipt.distributionCheck.status -ne 'PASS') { throw 'Unverified distribution' }
          $nativeResult = Join-Path (Split-Path (Split-Path $receipt.native.artifacts.commandRunner.path -Parent) -Parent) 'build-result.json'
          "AAW_PACKAGED_NATIVE_RESULT=$nativeResult" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prove the same native binaries relocate without root overrides
        run: |
          if (-not (Test-Path -LiteralPath $env:AAW_PACKAGED_NATIVE_RESULT -PathType Leaf)) { throw 'Missing native result' }
          node --test tests/packaged-native.integration.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install, launch twice, reinstall and uninstall without development tools on PATH
        run: |
          node tools/windows-installer-smoke.mjs "--build-result=$env:AAW_INSTALLER_RESULT"
          $smokeExit = $LASTEXITCODE
          if ($smokeExit -ne 0) {
            foreach ($file in (Get-ChildItem .local/installer-smoke/run-*/summary.json -ErrorAction SilentlyContinue)) {
              $summary = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              Write-Host "Installer stage=$($summary.stage)"
              if ($summary.error.message -cmatch '^[A-Za-z0-9_-]{1,120}$') { Write-Host "Installer error=$($summary.error.message)" }
            }
            foreach ($file in (Get-ChildItem .local/installed-ui-smoke/evidence/run-*/summary.json -ErrorAction SilentlyContinue)) {
              $summary = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
              foreach ($phase in $summary.results) {
                Write-Host "Desktop phase=$($phase.phase) stage=$($phase.stageBeforeClose) status=$($phase.status)"
                foreach ($record in $phase.startupDiagnostics.records) {
                  Write-Host "  $($record.source) $($record.phase) $($record.status) $($record.code)"
                }
                if ($phase.error -cmatch '^[A-Z0-9_]{1,120}$') { Write-Host "Desktop error=$($phase.error)" }
              }
            }
            exit $smokeExit
          }
      - name: Keep the unsigned alpha installer and bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer-${{ github.run_number }}
          retention-days: 7
          path: |
            .local/windows-installer/build-*/AnalogAIWorkbench-*-windows-x64-setup.exe
            .local/windows-installer/build-*/AnalogAIWorkbench-*-windows-x64-setup.exe.sha256
            .local/windows-installer/build-*/build-result.json
            .local/windows-installer/build-*/distribution-check/result.json
            .local/windows-installer/build-*/*.log
            .local/windows-installer/build-*/preflight/compiler.log
            .local/installer-smoke
            .local/installed-ui-smoke/evidence
            .local/packaged-native-tests/smoke-*/result.json
          if-no-files-found: ignore
